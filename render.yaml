services:
  - type: web
    name: ledgerlift
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: GEMINI_MODEL_CHAIN
        value: gemini-flash-latest,gemini-flash-lite-latest,gemini-3.5-flash
      - key: DATABASE_URL
        value: sqlite:///./receipt_extract.db
