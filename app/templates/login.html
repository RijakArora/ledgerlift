{% extends "base.html" %}
{% block title %}Log in - Ledgerlift{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;">
  <h2>Log in</h2>
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form class="simple" method="post" action="/login">
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" name="email" placeholder="you@example.com" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required>
    </div>
    <button type="submit" data-busy="Logging in...">Log in</button>
  </form>
  <p class="muted" style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
    <span>No account yet? <a href="/signup">Sign up free</a></span>
    <a href="/forgot-password">Forgot password?</a>
  </p>
</div>
{% endblock %}
