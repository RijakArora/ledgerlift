<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ledgerlift{% endblock %}</title>
<meta name="description" content="Upload an invoice or receipt and get the vendor, dates, tax, totals and line items back as clean data you can export to CSV.">
<meta name="color-scheme" content="light dark">
<script>
  // Runs before first paint so the right theme is applied immediately.
  // Doing this after the CSS loads would flash the wrong theme for a
  // frame, which reads as broken - especially light-flashing someone
  // using dark mode at night.
  (function () {
    try {
      var stored = localStorage.getItem("ll-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  /* ---------------- theme tokens ---------------- */
  :root, [data-theme="light"] {
    --ink:        #12151a;
    --ink-2:      #3d4552;
    --ink-3:      #6b7480;
    --paper:      #fbfbfa;
    --paper-2:    #f4f5f2;
    --card:       #ffffff;
    --line:       #e6e7e3;
    --line-soft:  #f0f1ed;
    --accent:     #16624a;
    --accent-2:   #1d7a5c;
    --accent-ink: #ffffff;
    --accent-soft:#eaf3ef;
    --alert-bg:#fdecea; --alert-ink:#98302b; --alert-line:#f0cdc9;
    --warn-bg: #fdf4e3; --warn-ink: #855312; --warn-line:#efdcb8;
    --ok-bg:   #e8f4ec; --ok-ink:   #1b6640; --ok-line:#c6e2d1;
    --info-bg: #eef3fa; --info-ink: #28527d;
    --field:      #ffffff;
    --field-line: #d9dad4;
    --shadow-sm: 0 1px 2px rgba(16,18,14,.05);
    --shadow:    0 1px 3px rgba(16,18,14,.05), 0 8px 24px -8px rgba(16,18,14,.10);
  }

  [data-theme="dark"] {
    --ink:        #eef1f4;
    --ink-2:      #b3bcc7;
    --ink-3:      #8b95a1;
    --paper:      #0e1114;
    --paper-2:    #14181c;
    --card:       #171b20;
    --line:       #272d34;
    --line-soft:  #1f242a;
    --accent:     #3fbd8f;
    --accent-2:   #52d3a3;
    --accent-ink: #08120e;
    --accent-soft:rgba(63,189,143,.13);
    --alert-bg:rgba(220,90,80,.14); --alert-ink:#f2a49c; --alert-line:rgba(220,90,80,.30);
    --warn-bg: rgba(224,164,72,.14); --warn-ink:#f0c785; --warn-line:rgba(224,164,72,.30);
    --ok-bg:   rgba(63,189,143,.14); --ok-ink:  #7fdcb4; --ok-line:rgba(63,189,143,.30);
    --info-bg: rgba(96,150,220,.14); --info-ink:#9dc0ee;
    --field:      #12161a;
    --field-line: #2e353d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow:    0 1px 3px rgba(0,0,0,.4), 0 10px 28px -10px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: var(--paper); color: var(--ink); margin: 0;
    line-height: 1.55; font-size: 16px; -webkit-font-smoothing: antialiased;
    transition: background-color .28s ease, color .28s ease;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: var(--accent); }

  /* ---------------- motion ---------------- */
  @keyframes riseIn { from { opacity:0; transform: translateY(9px); } to { opacity:1; transform:none; } }
  .rise { animation: riseIn .42s cubic-bezier(.22,.68,.32,1) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
  }

  /* ---------------- header ---------------- */
  header {
    background: color-mix(in srgb, var(--paper) 86%, transparent);
    backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
    transition: background-color .28s ease, border-color .28s ease;
  }
  header .bar {
    max-width: 1080px; margin: 0 auto; padding: 13px 22px;
    display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { display:flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none;
           font-weight:680; font-size:16.5px; letter-spacing:-.01em; }
  .brand .mark {
    width:22px; height:22px; border-radius:6px; flex:0 0 auto; position:relative;
    background: linear-gradient(140deg, var(--accent-2), var(--accent));
    box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform .25s cubic-bezier(.22,.68,.32,1);
  }
  .brand:hover .mark { transform: rotate(-6deg) scale(1.06); }
  .brand .mark::after {
    content:""; position:absolute; left:5px; right:5px; top:6px; height:2px; border-radius:2px;
    background: var(--accent-ink);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent-ink) 80%, transparent),
                0 8px 0 color-mix(in srgb, var(--accent-ink) 50%, transparent);
  }
  header nav { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  header nav a { color:var(--ink-2); text-decoration:none; font-size:14.5px; font-weight:520;
                 position:relative; transition:color .18s ease; }
  header nav a:hover { color:var(--ink); }
  header nav a:not(.cta):not(.muted-link)::after {
    content:""; position:absolute; left:0; right:0; bottom:-5px; height:2px; border-radius:2px;
    background:var(--accent); transform:scaleX(0); transform-origin:left;
    transition:transform .22s cubic-bezier(.22,.68,.32,1);
  }
  header nav a:not(.cta):not(.muted-link):hover::after { transform:scaleX(1); }
  header nav a.muted-link { color:var(--ink-3); font-size:13.5px; }
  header nav a.cta {
    background:var(--accent); color:var(--accent-ink); padding:8px 15px; border-radius:9px; font-weight:620;
    transition: background .18s ease, transform .18s cubic-bezier(.22,.68,.32,1), box-shadow .18s ease;
  }
  header nav a.cta:hover { background:var(--accent-2); color:var(--accent-ink);
    transform:translateY(-1px); box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent); }

  .theme-toggle {
    width:34px; height:34px; border-radius:99px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-2); cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .25s cubic-bezier(.22,.68,.32,1);
  }
  .theme-toggle:hover { color:var(--ink); transform:rotate(-18deg) scale(1.07); background:var(--paper-2); }
  .theme-toggle svg { width:16px; height:16px; }
  .theme-toggle .moon { display:none; }
  [data-theme="dark"] .theme-toggle .moon { display:block; }
  [data-theme="dark"] .theme-toggle .sun  { display:none; }

  /* ---------------- layout ---------------- */
  main { max-width: 1080px; margin: 0 auto; padding: 34px 22px 72px; width:100%; flex:1; }
  main.narrow { max-width: 820px; }

  .card {
    background: var(--card); border:1px solid var(--line); border-radius: 12px;
    padding: 26px; margin-bottom: 22px; box-shadow: var(--shadow-sm);
    transition: background-color .28s ease, border-color .28s ease, box-shadow .25s ease,
                transform .25s cubic-bezier(.22,.68,.32,1);
  }
  .card.flush { padding: 0; overflow: hidden; }

  h1 { font-size: 34px; line-height:1.15; letter-spacing:-.022em; margin:0 0 12px; font-weight:700; }
  h2 { font-size: 21px; letter-spacing:-.015em; margin:0 0 10px; font-weight:650; }
  h3 { font-size: 15.5px; letter-spacing:-.005em; margin:0 0 12px; font-weight:650; }
  .eyebrow { font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
             color:var(--accent); margin:0 0 10px; }
  .lede { font-size:17.5px; color:var(--ink-2); line-height:1.5; }

  /* ---------------- tables ---------------- */
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 10px; border-bottom:1px solid var(--line-soft); }
  th { color:var(--ink-3); font-weight:640; font-size:11.5px; text-transform:uppercase; letter-spacing:.055em; }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  table tr { transition: background-color .15s ease; }
  table tr:hover td { background: var(--line-soft); }

  /* ---------------- bits ---------------- */
  .badge { display:inline-block; padding:2.5px 9px; border-radius:99px; font-size:11.5px;
           font-weight:700; letter-spacing:.01em; border:1px solid transparent; }
  .badge-ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);}
  .badge-fail{background:var(--alert-bg);color:var(--alert-ink);border-color:var(--alert-line);}
  .badge-plan{background:var(--accent-soft);color:var(--accent);}
  .badge-warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line);}

  form.simple { display:flex; flex-direction:column; gap:15px; max-width:390px; }
  label { font-size:13.5px; font-weight:620; color:var(--ink-2); display:block; margin-bottom:6px; }
  input[type=text],input[type=email],input[type=password],input[type=file],select,textarea {
    padding:11px 13px; font-size:15px; border-radius:9px; border:1px solid var(--field-line);
    background:var(--field); width:100%; color:var(--ink);
    transition:border-color .16s ease, box-shadow .16s ease, background-color .28s ease;
  }
  input:focus,select:focus,textarea:focus {
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  button, .btn {
    padding:11px 19px; font-size:15px; font-weight:620; border-radius:9px; border:1px solid transparent;
    background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none;
    display:inline-block; text-align:center;
    transition: background .18s ease, transform .16s cubic-bezier(.22,.68,.32,1), box-shadow .18s ease;
  }
  button:hover,.btn:hover { background:var(--accent-2);
    transform:translateY(-1px); box-shadow:0 6px 18px -8px color-mix(in srgb, var(--accent) 75%, transparent); }
  button:active,.btn:active { transform:translateY(0); }
  button:disabled { opacity:.6; cursor:progress; transform:none; box-shadow:none; }
  .btn.secondary { background:var(--card); color:var(--ink); border-color:var(--field-line); }
  .btn.secondary:hover { background:var(--paper-2); }
  .btn-row { display:flex; gap:11px; flex-wrap:wrap; align-items:center; }

  .notice { padding:12px 15px; border-radius:9px; margin-bottom:18px; font-size:14.5px;
            border:1px solid transparent; }
  .error{background:var(--alert-bg);color:var(--alert-ink);border-color:var(--alert-line);}
  .ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);}
  .info{background:var(--info-bg);color:var(--info-ink);}
  .warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line);}

  .muted { color:var(--ink-3); font-size:13.5px; }
  code { background:var(--line-soft); padding:1px 5px; border-radius:4px; font-size:.92em; }
  pre { background:var(--paper-2) !important; border-color:var(--line) !important; color:var(--ink-2); }

  .kv { display:grid; grid-template-columns:180px 1fr; gap:9px 18px; font-size:14.5px; }
  .kv dt { color:var(--ink-3); font-weight:600; }
  .kv dd { margin:0; font-variant-numeric: tabular-nums; }
  .quota-bar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:9px; }
  .quota-bar span { display:block; height:100%; border-radius:99px;
                    background:linear-gradient(90deg, var(--accent), var(--accent-2));
                    transition: width .6s cubic-bezier(.22,.68,.32,1); }

  .steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .steps li { display:flex; gap:14px; align-items:flex-start; }
  .steps .num { flex:0 0 auto; width:25px; height:25px; border-radius:99px;
    background:var(--accent-soft); color:var(--accent); font-size:12.5px; font-weight:750;
    display:flex; align-items:center; justify-content:center; margin-top:1px; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .split { display:grid; grid-template-columns: 1.05fr .95fr; gap:0; }
  .split > div { padding:24px; }
  .split > div:first-child { border-right:1px solid var(--line); background:var(--paper-2); }
  .shot { width:100%; border:1px solid var(--line); border-radius:9px; display:block; box-shadow:var(--shadow-sm); }

  /* dashboard stats */
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; box-shadow:var(--shadow-sm);
          transition:transform .25s cubic-bezier(.22,.68,.32,1), box-shadow .25s ease,
                     background-color .28s ease, border-color .28s ease; }
  .stat:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .stat-label { display:block; font-size:12px; font-weight:650; letter-spacing:.05em;
                text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; }
  .stat-value { display:block; font-size:27px; font-weight:680; letter-spacing:-.02em;
                font-variant-numeric:tabular-nums; line-height:1.1; }
  .stat-value.warn { color:var(--warn-ink); }
  .stat-sub { font-size:15px; font-weight:500; color:var(--ink-3); margin-left:4px; }

  .attn { padding:14px 0; border-top:1px solid var(--line-soft); }
  .attn:first-of-type { border-top:none; padding-top:6px; }
  .attn-list { margin:10px 0 0; padding-left:18px; font-size:14px; }
  .attn-list li { margin-bottom:5px; }

  /* drag & drop upload */
  .dropzone {
    border:2px dashed var(--field-line); border-radius:12px; padding:34px 22px; text-align:center;
    background:var(--paper-2); cursor:pointer;
    transition: border-color .2s ease, background-color .2s ease, transform .2s cubic-bezier(.22,.68,.32,1);
  }
  .dropzone:hover { border-color:var(--accent); }
  .dropzone.dragging { border-color:var(--accent); background:var(--accent-soft); transform:scale(1.01); }
  .dropzone .dz-icon { font-size:24px; display:block; margin-bottom:8px; opacity:.75; }
  .dropzone .dz-main { font-weight:620; font-size:15.5px; }
  .file-list { margin:14px 0 0; padding-left:18px; font-size:14px; text-align:left; }
  .file-list li { margin-bottom:4px; color:var(--ink-2); }

  /* legal pages */
  .legal h1 { font-size:29px; margin-bottom:6px; }
  .legal h2 { font-size:16.5px; margin-top:30px; }
  .legal p, .legal li { font-size:15.2px; color:var(--ink-2); }
  .legal ul { padding-left:20px; }
  .legal .updated { color:var(--ink-3); font-size:13.5px; margin-top:0; }

  footer { border-top:1px solid var(--line); background:var(--paper-2);
           transition:background-color .28s ease, border-color .28s ease; }
  footer .inner { max-width:1080px; margin:0 auto; padding:26px 22px 40px;
                  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  footer a { color:var(--ink-2); text-decoration:none; font-size:14px; margin-right:20px; }
  footer a:hover { color:var(--ink); text-decoration:underline; }
  footer .co { color:var(--ink-3); font-size:13.5px; }

  @media (max-width: 860px) {
    .split { grid-template-columns:1fr; }
    .split > div:first-child { border-right:none; border-bottom:1px solid var(--line); }
    .grid-2 { grid-template-columns:1fr; }
  }
  @media (max-width: 600px) {
    body { font-size:15.5px; }
    h1 { font-size:27px; } .lede { font-size:16.5px; }
    main { padding:22px 16px 56px; }
    .card { padding:18px; } .split > div { padding:18px; }
    header .bar { padding:11px 16px; gap:10px; }
    header nav { gap:14px; }
    .kv { grid-template-columns:1fr; gap:2px 0; }
    .kv dd { margin-bottom:11px; }
    form.simple { max-width:100%; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/"><span class="mark"></span> Ledgerlift</a>
    <nav>
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/documents">Documents</a>
        <a href="/clients">Clients</a>
        <a href="/team">Sharing</a>
        <a class="cta" href="/upload">Upload</a>
        <a class="muted-link" href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
        <a class="cta" href="/signup">Start free</a>
      {% endif %}
      <button class="theme-toggle" type="button" onclick="llToggleTheme()"
              aria-label="Switch between light and dark mode" title="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
      </button>
    </nav>
  </div>
</header>
<main{% if narrow %} class="narrow"{% endif %}>
{% block content %}{% endblock %}
</main>
<footer>
  <div class="inner">
    <div>
      <a href="/terms">Terms</a>
      <a href="/refund-policy">Refunds</a>
      <a href="/privacy">Privacy</a>
      <a href="mailto:{{ site.support_email }}">Support</a>
    </div>
    <div class="co">{{ site.brand }} &middot; {{ site.support_email }}</div>
  </div>
</footer>
<script>
  function llToggleTheme() {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("ll-theme", next); } catch (e) {}
  }

  // Follow the OS only while the user has not made an explicit choice.
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
      if (!localStorage.getItem("ll-theme")) {
        document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
      }
    });
  } catch (e) {}

  // Free-tier hosting sleeps after ~15 min idle; the first request then
  // takes 30-50s. Pinging on load usually wakes it while the visitor is
  // still reading, so their first real action feels normal.
  fetch("/health").catch(function () {});

  // Extraction is a model call taking a few seconds. Without feedback the
  // page looks frozen, which reads as broken.
  document.querySelectorAll("form").forEach(function (form) {
    form.addEventListener("submit", function () {
      var btn = form.querySelector("button[type=submit]");
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = btn.dataset.busy || "Working...";
    });
  });

  // Stagger content in on load. Decorative only, and fully disabled for
  // anyone who prefers reduced motion (handled in CSS).
  document.querySelectorAll("main > .card, main > .stat-row, main > .grid-2, main > h2").forEach(function (el, i) {
    el.classList.add("rise");
    el.style.animationDelay = Math.min(i * 55, 280) + "ms";
  });
</script>
</body>
</html>
